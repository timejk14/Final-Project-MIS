<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StaffFlow - Training Center</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body class="dashboard-body">

<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <h2>StaffFlow</h2>
            <p>Work • Learn • Track</p>
        </div>

        <nav class="sidebar-menu">

            <a
                href="dashboard.html"
                class="menu-item"
            >
                Dashboard
            </a>

            <a
                href="announcements.html"
                class="menu-item"
            >
                Announcements
            </a>

            <a
                href="requests.html"
                class="menu-item"
            >
                Requests
            </a>

            <a
                href="training.html"
                class="menu-item active"
            >
                Training Center
            </a>

            <a
                href="tracking.html"
                class="menu-item"
            >
                Tracking
            </a>

            <a
                href="reports.html"
                class="menu-item"
            >
                Reports
            </a>

        </nav>

        <button
            class="logout-button"
            onclick="logout()"
        >
            Logout
        </button>

    </aside>


    <!-- Main -->
    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Training Center</h1>

                <p>
                    เรียนรู้และติดตามความคืบหน้าการอบรมในระบบเดียว
                </p>
            </div>

            <div class="user-profile">

                <div class="avatar">
                    SF
                </div>

                <div>
                    <strong id="userName"></strong>
                    <small id="userRole"></small>
                </div>

            </div>

        </header>


        <section class="training-page-header">

            <div>

                <h2>
                    หลักสูตรของฉัน
                </h2>

                <p>
                    เลือกหลักสูตรเพื่อเรียนต่อหรือดูผลการอบรม
                </p>

            </div>

        </section>


        <section
            id="trainingList"
            class="training-course-grid"
        >
        </section>

    </main>

</div>


<script src="data/data.js"></script>
<script src="js/app.js"></script>
<script src="js/training.js"></script>

</body>

</html>
